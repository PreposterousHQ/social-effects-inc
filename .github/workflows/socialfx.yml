name: Social FX checks
on:
  pull_request:
    paths: ['socialfx-src/**', 'socialF(X)/**', '.github/workflows/socialfx.yml']
  push:
    branches: [main]
    paths: ['socialfx-src/**', 'socialF(X)/**', '.github/workflows/socialfx.yml']
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: socialfx-src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: socialfx-src/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- '../socialF(X)'
